spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: device
              uri: lb://DEVICE
              predicates:
                - Path=/device/**

  application:
    name: gateway

server:
  port: 8080

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true

    service-url:
      defaultZone: http://localhost:8761/eureka/